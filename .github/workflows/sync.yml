name: Integration sync

# Vercel Hobby crons run at most once a day, so this workflow triggers the
# protected sync endpoint every 6 hours. /api/cron/sync only re-syncs
# connections whose last sync is older than its own 3h guard, so this never
# hammers the university servers. Manual "Sync now" in the app still works too.
# GitHub may delay scheduled runs and disables them after 60 days without
# repository activity. Requires repository secrets ORBIT_URL and CRON_SECRET.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/sync
        env:
          ORBIT_URL: ${{ secrets.ORBIT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ORBIT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ORBIT_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 300 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ORBIT_URL/api/cron/sync"
