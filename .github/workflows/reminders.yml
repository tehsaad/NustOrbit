name: Reminder dispatch

# Vercel Hobby crons run at most once a day, so this workflow triggers the
# protected reminder endpoint every 10 minutes. GitHub may delay scheduled runs
# and disables them after 60 days without repository activity.
# Requires repository secrets ORBIT_URL and CRON_SECRET (see docs/deployment.md).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/reminders
        env:
          ORBIT_URL: ${{ secrets.ORBIT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ORBIT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ORBIT_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 100 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ORBIT_URL/api/cron/reminders"
